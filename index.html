<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>R&C Collection Tracker</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="manifest" href="manifest.json"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="R&amp;C Tracker"/>
  <meta name="theme-color" content="#7B4FD4"/>
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dmfq8hkvu/image/upload/v1788954181/Ratchet_Legacy_ikwdp6.jpg"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://media-library.cloudinary.com/global/all.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0D0F1A;--bg2:#13162A;--bg3:#1A1E35;
      --purple:#7B4FD4;--purple-light:#9B6FF4;
      --orange:#FF6B1A;--orange-light:#FF8C4A;
      --chrome:#C4C8D4;
      --owned:#3DD68C;--wishlist:#FFD447;--missing:#FF4D6A;
      --profit:#3DD68C;--loss:#FF4D6A;--neutral:#8890A8;
      --text:#E8EAF0;--text-dim:#8890A8;
      --r:12px;
    }
    /* ══ UNIVERSE THEMES ══ */
    /* Lombax (default) uses :root above. */
    [data-theme="clank"]{
      --bg:#08131C;--bg2:#0C1B28;--bg3:#122838;
      --purple:#00A8D8;--purple-light:#4DD4F5;
      --orange:#00E68C;--orange-light:#4FF0AC;
      --chrome:#A8D0E0;
      --owned:#00E68C;--wishlist:#FFD447;--missing:#FF5A6A;
      --profit:#00E68C;--loss:#FF5A6A;--neutral:#5F9BB4;
      --text:#E4F4FA;--text-dim:#6F9BAC;
    }
    [data-theme="gadgetron"]{
      --bg:#160F06;--bg2:#221708;--bg3:#30200D;
      --purple:#FFB81A;--purple-light:#FFD24D;
      --orange:#FF6E00;--orange-light:#FF9433;
      --chrome:#E0C89C;
      --owned:#A0DC28;--wishlist:#FFD447;--missing:#FF5030;
      --profit:#A0DC28;--loss:#FF5030;--neutral:#B0A070;
      --text:#F8EFD4;--text-dim:#B09B72;
    }
    [data-theme="qwark"]{
      --bg:#0C0A1E;--bg2:#12102C;--bg3:#1A1840;
      --purple:#4FC22A;--purple-light:#6FE04A;
      --orange:#8A4FE0;--orange-light:#A87FF0;
      --chrome:#B0A0D0;
      --owned:#4FC22A;--wishlist:#FFD447;--missing:#FF5A6A;
      --profit:#4FC22A;--loss:#FF5A6A;--neutral:#8878B4;
      --text:#ECE4F8;--text-dim:#9B8FAC;
    }
    [data-theme="arsenal"]{
      --bg:#180000;--bg2:#260404;--bg3:#3A0808;
      --purple:#E01800;--purple-light:#FF4A28;
      --orange:#FF8A1A;--orange-light:#FFA54D;
      --chrome:#E0A090;
      --owned:#8FD44A;--wishlist:#FFC020;--missing:#FF3A2A;
      --profit:#8FD44A;--loss:#FF3A2A;--neutral:#B08078;
      --text:#F8E4E0;--text-dim:#B08F8A;
    }
    [data-theme="nebula"]{
      --bg:#08101C;--bg2:#0C1826;--bg3:#12253A;
      --purple:#00D4C4;--purple-light:#4FEADB;
      --orange:#4A7AC8;--orange-light:#7F9BE0;
      --chrome:#A0C8D0;
      --owned:#00D4C4;--wishlist:#FFD447;--missing:#FF5A6A;
      --profit:#00D4C4;--loss:#FF5A6A;--neutral:#6F9BB4;
      --text:#E4F6F4;--text-dim:#6FA0AC;
    }
    [data-theme="rivet"]{
      --bg:#160F0A;--bg2:#221812;--bg3:#30221C;
      --purple:#F0722A;--purple-light:#FF945F;
      --orange:#9B5FF8;--orange-light:#B58FFA;
      --chrome:#C4B0A0;
      --owned:#8FD44A;--wishlist:#FFD447;--missing:#FF5A6A;
      --profit:#8FD44A;--loss:#FF5A6A;--neutral:#A89080;
      --text:#F8ECE4;--text-dim:#B09B8F;
    }
    [data-theme="nefarious"]{
      --bg:#0E0A1E;--bg2:#16102E;--bg3:#221842;
      --purple:#7848C0;--purple-light:#9F6FF0;
      --orange:#F01800;--orange-light:#FF4A28;
      --chrome:#B0A0D8;
      --owned:#9F6FF0;--wishlist:#FFB020;--missing:#FF3A4D;
      --profit:#9F6FF0;--loss:#FF3A4D;--neutral:#9080B4;
      --text:#EEE4F8;--text-dim:#9B8FAC;
    }
    [data-theme="kit"]{
      --bg:#120C06;--bg2:#1C1410;--bg3:#2A1F13;
      --purple:#E89830;--purple-light:#FFB854;
      --orange:#4FD0E8;--orange-light:#7FE0F0;
      --chrome:#D0C0A0;
      --owned:#8FD44A;--wishlist:#FFD447;--missing:#FF5A6A;
      --profit:#8FD44A;--loss:#FF5A6A;--neutral:#B0A080;
      --text:#F8EEDC;--text-dim:#B09B72;
    }
    /* ══ STRONG PER-THEME CARD STYLING (works with overflow:hidden) ══ */

    /* CLANK — hard tech: thick cyan frame, dark metal, top scanline, cut corner via border */
    [data-theme="clank"] .item-card,[data-theme="clank"] .catalog-row,[data-theme="clank"] .fr-card,
    [data-theme="clank"] .wiki-card,[data-theme="clank"] .home-tile,[data-theme="clank"] .theme-card{
      border-radius:0 !important;
      border:2px solid #3FA9C9 !important;
      border-top-width:5px !important;
      background:
        repeating-linear-gradient(90deg, rgba(95,205,232,.06) 0 1px, transparent 1px 10px),
        linear-gradient(160deg, #142433, #0A1016) !important;
      box-shadow:inset 0 0 0 1px rgba(10,16,22,1), inset 0 0 24px rgba(63,169,201,.12) !important;
    }
    /* KIT — brass: thick gold frame, warm hatch texture */
    [data-theme="kit"] .item-card,[data-theme="kit"] .catalog-row,[data-theme="kit"] .fr-card,
    [data-theme="kit"] .wiki-card,[data-theme="kit"] .home-tile,[data-theme="kit"] .theme-card{
      border-radius:0 !important;
      border:2px solid #D89030 !important;
      border-left-width:6px !important;
      background:
        repeating-linear-gradient(45deg, rgba(240,176,84,.06) 0 6px, transparent 6px 12px),
        linear-gradient(160deg, #261D13, #100C08) !important;
      box-shadow:inset 0 0 24px rgba(216,144,48,.12) !important;
    }
    /* NEFARIOUS — villain: glowing orange frame on purple, energy grid */
    [data-theme="nefarious"] .item-card,[data-theme="nefarious"] .catalog-row,[data-theme="nefarious"] .fr-card,
    [data-theme="nefarious"] .wiki-card,[data-theme="nefarious"] .home-tile,[data-theme="nefarious"] .theme-card{
      border-radius:0 !important;
      border:2px solid #FF6A1A !important;
      background:
        repeating-linear-gradient(0deg, rgba(180,160,255,.06) 0 1px, transparent 1px 12px),
        linear-gradient(160deg, #1E1838, #0C0A1A) !important;
      box-shadow:0 0 18px rgba(90,58,212,.4), inset 0 0 30px rgba(255,106,26,.10) !important;
    }
    /* NEBULA — glassy rounded, cyan glow, blur */
    [data-theme="nebula"] .item-card,[data-theme="nebula"] .catalog-row,[data-theme="nebula"] .fr-card,
    [data-theme="nebula"] .wiki-card,[data-theme="nebula"] .home-tile,[data-theme="nebula"] .theme-card{
      border-radius:22px !important;
      border:1px solid rgba(43,212,196,.45) !important;
      background:linear-gradient(160deg, rgba(19,37,56,.7), rgba(10,16,24,.6)) !important;
      backdrop-filter:blur(6px);
      box-shadow:0 6px 26px rgba(43,212,196,.22), inset 0 1px 0 rgba(120,210,235,.2) !important;
    }
    /* QWARK — heroic: fat top accent bar, big radius, blue glow */
    [data-theme="qwark"] .item-card,[data-theme="qwark"] .catalog-row,[data-theme="qwark"] .fr-card,
    [data-theme="qwark"] .wiki-card,[data-theme="qwark"] .home-tile,[data-theme="qwark"] .theme-card{
      border-radius:16px !important;
      border:1px solid rgba(70,214,255,.35) !important;
      border-top:6px solid #3FB54A !important;
      background:linear-gradient(160deg, #132840, #0A1422) !important;
      box-shadow:0 6px 20px rgba(70,214,255,.22) !important;
    }
    /* ARSENAL — blazing Martian red, lava glow, fat orange top bar */
    [data-theme="arsenal"] .item-card,[data-theme="arsenal"] .catalog-row,[data-theme="arsenal"] .fr-card,
    [data-theme="arsenal"] .wiki-card,[data-theme="arsenal"] .home-tile,[data-theme="arsenal"] .theme-card{
      border-radius:8px !important;
      border:1px solid rgba(240,60,0,.5) !important;
      border-top:5px solid #FF8A1A !important;
      background:linear-gradient(160deg, #3A0808, #180000) !important;
      box-shadow:0 4px 18px rgba(224,24,0,.3), inset 0 0 26px rgba(255,138,26,.08) !important;
    }
    /* GADGETRON — industrial: fat hazard left border, boxy, warm */
    [data-theme="gadgetron"] .item-card,[data-theme="gadgetron"] .catalog-row,[data-theme="gadgetron"] .fr-card,
    [data-theme="gadgetron"] .wiki-card,[data-theme="gadgetron"] .home-tile,[data-theme="gadgetron"] .theme-card{
      border-radius:4px !important;
      border:2px solid rgba(255,176,32,.5) !important;
      border-left:8px solid #FFB020 !important;
      background:
        repeating-linear-gradient(45deg, rgba(255,176,32,.05) 0 10px, transparent 10px 20px),
        linear-gradient(160deg, #2A2113, #14100A) !important;
      box-shadow:0 3px 10px rgba(0,0,0,.5) !important;
    }
    /* RIVET — rugged: fat rust bottom border, warm */
    [data-theme="rivet"] .item-card,[data-theme="rivet"] .catalog-row,[data-theme="rivet"] .fr-card,
    [data-theme="rivet"] .wiki-card,[data-theme="rivet"] .home-tile,[data-theme="rivet"] .theme-card{
      border-radius:12px !important;
      border:1px solid rgba(224,112,58,.45) !important;
      border-bottom:6px solid #E0703A !important;
      background:linear-gradient(160deg, #2A211C, #14100C) !important;
      box-shadow:0 4px 14px rgba(155,111,244,.18) !important;
    }
    /* Lombax (default): subtle upgrade so it doesn't feel plain */
    [data-theme=""] .item-card, :root .item-card{}
    /* Hover lift stronger for all themed cards */
    [data-theme] .item-card:hover{transform:translateY(-3px)}

    /* ══ ADVANCED THEME IMMERSION ══ */

    /* --- Animated glow pulse on cards for energy themes --- */
    @keyframes cardGlowCyan{0%,100%{box-shadow:0 6px 26px rgba(43,212,196,.18)}50%{box-shadow:0 6px 30px rgba(43,212,196,.4)}}
    @keyframes cardGlowOrange{0%,100%{box-shadow:0 0 18px rgba(90,58,212,.35)}50%{box-shadow:0 0 26px rgba(255,106,26,.5)}}
    @keyframes cardGlowBlue{0%,100%{box-shadow:0 6px 20px rgba(70,214,255,.2)}50%{box-shadow:0 6px 26px rgba(70,214,255,.4)}}
    @keyframes cardGlowRed{0%,100%{box-shadow:0 4px 18px rgba(224,24,0,.3)}50%{box-shadow:0 4px 26px rgba(255,74,40,.5)}}
    [data-theme="nebula"] .item-card{animation:cardGlowCyan 4s ease-in-out infinite}
    [data-theme="nefarious"] .item-card{animation:cardGlowOrange 3.5s ease-in-out infinite}
    [data-theme="qwark"] .item-card{animation:cardGlowBlue 4s ease-in-out infinite}
    [data-theme="arsenal"] .item-card{animation:cardGlowRed 3.5s ease-in-out infinite}

    /* --- Metal sheen sweep across card covers (robotic themes) --- */
    @keyframes sheenSweep{0%{transform:translateX(-120%) skewX(-20deg)}60%,100%{transform:translateX(220%) skewX(-20deg)}}
    [data-theme="clank"] .card-cover,[data-theme="kit"] .card-cover,[data-theme="nefarious"] .card-cover{position:relative;overflow:hidden}
    [data-theme="clank"] .card-cover::after,[data-theme="kit"] .card-cover::after,[data-theme="nefarious"] .card-cover::after{
      content:'';position:absolute;top:0;left:0;width:40%;height:100%;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
      animation:sheenSweep 5s ease-in-out infinite;pointer-events:none;
    }

    /* --- Themed HEADER --- */
    [data-theme="clank"] header,[data-theme="kit"] header,[data-theme="nefarious"] header{
      border-bottom:2px solid var(--purple);
      background:linear-gradient(180deg, rgba(255,255,255,.02), transparent);
    }
    [data-theme="nebula"] header{border-bottom:1px solid rgba(43,212,196,.4)}
    [data-theme="qwark"] header{border-bottom:3px solid #3FB54A}
    [data-theme="gadgetron"] header{border-bottom:3px dashed rgba(255,176,32,.5)}
    [data-theme="rivet"] header{border-bottom:2px solid rgba(224,112,58,.5)}

    /* --- Themed ADD button gets an animated gradient in every theme --- */
    @keyframes btnFlow{0%{background-position:0% 50%}100%{background-position:200% 50%}}
    [data-theme] .add-btn{
      background:linear-gradient(90deg,var(--purple),var(--orange),var(--purple)) !important;
      background-size:200% 100% !important;
      animation:btnFlow 3s linear infinite;
    }

    /* --- Themed FILTER buttons (active state uses theme accent strongly) --- */
    [data-theme] .filter-btn.active{
      background:linear-gradient(135deg,var(--purple),var(--orange)) !important;
      color:#fff !important;border-color:transparent !important;
      box-shadow:0 2px 10px rgba(0,0,0,.3);
    }
    /* Robotic filter buttons get cut corners */
    [data-theme="clank"] .filter-btn,[data-theme="kit"] .filter-btn,[data-theme="nefarious"] .filter-btn{
      border-radius:0 !important;clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
    }

    /* --- Category titles get themed accent --- */
    [data-theme="clank"] .cat-title,[data-theme="kit"] .cat-title,[data-theme="nefarious"] .cat-title,
    [data-theme="gadgetron"] .cat-title{font-family:'Orbitron',sans-serif;letter-spacing:.05em}
    [data-theme="nefarious"] .cat-title{text-shadow:0 0 10px rgba(255,106,26,.5)}
    [data-theme="nebula"] .cat-title{text-shadow:0 0 12px rgba(43,212,196,.5)}
    [data-theme="qwark"] .cat-title{text-shadow:0 0 10px rgba(70,214,255,.5)}

    /* --- Card cover texture per theme (behind the image) --- */
    [data-theme="gadgetron"] .card-cover{
      background-image:repeating-linear-gradient(45deg, rgba(255,176,32,.08) 0 8px, transparent 8px 16px);
    }
    [data-theme="clank"] .card-cover{
      background-image:repeating-linear-gradient(0deg, rgba(95,205,232,.06) 0 2px, transparent 2px 8px);
    }
    [data-theme="nebula"] .card-cover{
      background-image:radial-gradient(circle at 30% 30%, rgba(43,212,196,.12), transparent 60%);
    }

    /* ══ IMMERSIVE PER-THEME STYLING ══ */
    /* Background textures (subtle, non-distracting) */
    [data-theme="clank"] body, [data-theme="kit"] body, [data-theme="nefarious"] body{
      background-image:
        repeating-linear-gradient(90deg, rgba(255,255,255,.015) 0 1px, transparent 1px 40px),
        repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 1px, transparent 1px 40px);
    }
    [data-theme="nebula"] body{
      background-image:
        radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 70% 60%, rgba(255,255,255,.3), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,.35), transparent),
        radial-gradient(1px 1px at 85% 15%, rgba(255,255,255,.25), transparent),
        radial-gradient(2px 2px at 55% 45%, rgba(120,210,235,.3), transparent);
      background-attachment:fixed;
    }
    [data-theme="gadgetron"] body{
      background-image: repeating-linear-gradient(45deg, rgba(255,176,32,.03) 0 12px, transparent 12px 24px);
    }
    [data-theme="qwark"] body{
      background-image: radial-gradient(circle at 50% 0%, rgba(70,214,255,.08), transparent 60%);
      background-attachment:fixed;
    }

    /* Heading fonts per family */
    [data-theme="clank"] h1,[data-theme="clank"] h2,[data-theme="kit"] h1,[data-theme="kit"] h2,
    [data-theme="nefarious"] h1,[data-theme="nefarious"] h2,[data-theme="gadgetron"] h1,[data-theme="gadgetron"] h2{
      font-family:'Orbitron',sans-serif !important; letter-spacing:.04em;
    }

    /* Signature glow on key elements */
    [data-theme="qwark"] .add-btn,[data-theme="nebula"] .add-btn{
      box-shadow:0 0 18px rgba(70,214,255,.35);
    }
    [data-theme="nefarious"] .add-btn{
      box-shadow:0 0 18px rgba(255,106,26,.4);
    }
    [data-theme="clank"] .rank-badge,[data-theme="kit"] .rank-badge{
      text-shadow:0 0 10px currentColor;
    }
    /* Robotic themes: rivet-like corner dots on cards */
    [data-theme="clank"] .catalog-row::before,[data-theme="kit"] .catalog-row::before,[data-theme="nefarious"] .catalog-row::before{
      content:'';position:absolute;top:6px;right:6px;width:4px;height:4px;border-radius:50%;
      background:var(--purple-light);opacity:.6;box-shadow:0 0 4px var(--purple-light);
    }
    /* Nebula & Qwark: rounded, soft, glowing cards */
    [data-theme="nebula"] .catalog-row,[data-theme="qwark"] .catalog-row{border-radius:16px}
    [data-theme="nebula"] .home-cta,[data-theme="qwark"] .home-cta{
      box-shadow:0 6px 24px rgba(70,214,255,.4);
    }
    /* Gadgetron: bold industrial borders */
    [data-theme="gadgetron"] .catalog-row,[data-theme="gadgetron"] .fr-card,[data-theme="gadgetron"] .home-tile{
      border-left:3px solid var(--purple) !important;
    }
    /* Rivet: diagonal accent */
    [data-theme="rivet"] .add-btn,[data-theme="rivet"] .home-cta{
      background:linear-gradient(115deg,var(--purple),var(--orange)) !important;
    }
    /* Animated shimmer for the confirm/apply button in robotic themes */
    @keyframes metalSweep{0%{background-position:-200% 0}100%{background-position:200% 0}}
    [data-theme="nefarious"] .home-cta,[data-theme="clank"] .home-cta,[data-theme="kit"] .home-cta{
      background-image:linear-gradient(110deg, var(--purple) 0%, var(--purple-light) 45%, var(--orange) 55%, var(--purple) 100%);
      background-size:200% 100%; animation:metalSweep 4s linear infinite;
    }

    /* ══ IMMERSIVE THEME BACKGROUNDS ══ */
    #theme-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;transition:opacity .4s;background-color:var(--bg)}
    /* Floating decorative elements layer */
    #theme-deco{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
    #theme-deco .deco{position:absolute;opacity:.5}
    @media(max-width:700px){#theme-deco .deco{opacity:.3}}
    @keyframes floatUp{0%{transform:translateY(20px) rotate(0deg)}100%{transform:translateY(-20px) rotate(360deg)}}
    @keyframes floatDrift{0%{transform:translate(0,0) rotate(0deg)}50%{transform:translate(20px,-15px) rotate(180deg)}100%{transform:translate(0,0) rotate(360deg)}}
    @keyframes twinkleDeco{0%,100%{opacity:.2}50%{opacity:.7}}
    @keyframes shipFly{0%{transform:translateX(-15vw)}100%{transform:translateX(115vw)}}
    #theme-deco .spin-slow{animation:floatUp 14s ease-in-out infinite alternate}
    #theme-deco .drift{animation:floatDrift 18s ease-in-out infinite}
    #theme-deco .twinkle{animation:twinkleDeco 4s ease-in-out infinite}
    #theme-deco .fly{animation:shipFly 28s linear infinite}
    #theme-bg{
      background-image:
        radial-gradient(circle at 15% 15%, rgba(123,79,212,.20), transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(255,138,42,.14), transparent 50%),
        radial-gradient(circle at 50% 50%, rgba(60,30,90,.10), transparent 70%);
    }
    [data-theme="clank"] #theme-bg{
      background-image:
        radial-gradient(circle at 50% 30%, rgba(70,224,140,.14), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(63,169,201,.16), transparent 50%),
        repeating-linear-gradient(90deg, rgba(120,180,200,.05) 0 1px, transparent 1px 48px),
        repeating-linear-gradient(0deg, rgba(120,180,200,.05) 0 1px, transparent 1px 48px);
    }
    [data-theme="gadgetron"] #theme-bg{
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,176,32,.16), transparent 45%),
        radial-gradient(circle at 75% 70%, rgba(255,122,26,.14), transparent 50%),
        repeating-linear-gradient(45deg, rgba(255,176,32,.04) 0 14px, transparent 14px 28px);
    }
    [data-theme="qwark"] #theme-bg{
      background-image:
        radial-gradient(ellipse at 50% -10%, rgba(138,79,224,.22), transparent 55%),
        radial-gradient(circle at 30% 80%, rgba(79,194,42,.16), transparent 50%);
    }
    [data-theme="arsenal"] #theme-bg{
      background-image:
        radial-gradient(ellipse at 50% 15%, rgba(240,60,0,.30), transparent 55%),
        radial-gradient(circle at 25% 85%, rgba(255,138,26,.20), transparent 50%),
        radial-gradient(circle at 80% 60%, rgba(160,24,0,.25), transparent 55%);
      animation:arsenalHeat 5s ease-in-out infinite alternate;
    }
    @keyframes arsenalHeat{0%{filter:brightness(.92)}100%{filter:brightness(1.12)}}
    [data-theme="nebula"] #theme-bg{
      background-image:
        radial-gradient(circle at 25% 30%, rgba(43,212,196,.16), transparent 45%),
        radial-gradient(circle at 75% 65%, rgba(90,122,168,.16), transparent 50%),
        radial-gradient(1px 1px at 10% 20%, #fff, transparent),
        radial-gradient(1px 1px at 30% 70%, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 60% 40%, #fff, transparent),
        radial-gradient(1px 1px at 80% 25%, rgba(255,255,255,.6), transparent),
        radial-gradient(2px 2px at 45% 85%, rgba(120,210,235,.6), transparent),
        radial-gradient(1px 1px at 90% 80%, #fff, transparent);
      animation:nebulaTwinkle 6s ease-in-out infinite alternate;
    }
    @keyframes nebulaTwinkle{0%{opacity:.75}100%{opacity:1}}
    [data-theme="rivet"] #theme-bg{
      background-image:
        radial-gradient(circle at 20% 25%, rgba(224,112,58,.18), transparent 48%),
        radial-gradient(circle at 80% 75%, rgba(155,111,244,.16), transparent 50%),
        repeating-linear-gradient(115deg, rgba(224,112,58,.04) 0 20px, transparent 20px 42px);
    }
    [data-theme="nefarious"] #theme-bg{
      background-image:
        radial-gradient(circle at 50% 40%, rgba(90,58,212,.22), transparent 50%),
        radial-gradient(circle at 50% 40%, rgba(255,106,26,.12), transparent 35%),
        repeating-linear-gradient(90deg, rgba(180,160,255,.04) 0 1px, transparent 1px 40px);
      animation:nefPulse 5s ease-in-out infinite alternate;
    }
    @keyframes nefPulse{0%{filter:brightness(.9)}100%{filter:brightness(1.15)}}
    [data-theme="kit"] #theme-bg{
      background-image:
        radial-gradient(circle at 25% 25%, rgba(216,144,48,.18), transparent 48%),
        radial-gradient(circle at 78% 72%, rgba(90,200,224,.16), transparent 50%),
        repeating-linear-gradient(0deg, rgba(216,144,48,.04) 0 1px, transparent 1px 44px);
    }
    @media(max-width:480px){
      .header-titles h1{font-size:.75rem}
      .header-titles span{display:none}
      .header-user{gap:4px}
      .header-user button{font-size:.62rem;padding:4px 8px}
      .header-profile-pseudo{display:none}
      .header-profile-btn{margin-left:auto;padding:3px;border-radius:50%;gap:0}
      .header-profile-avatar{width:32px;height:32px;font-size:1.05rem}
      .header-top{gap:8px}
    }
    body{font-family:'Inter',sans-serif;background:transparent;color:var(--text);min-height:100vh;max-width:100vw;overflow-x:hidden}
    html{background:var(--bg);overflow-x:hidden}

    /* AUTH */
    #auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 60% 20%,rgba(123,79,212,.18) 0%,transparent 60%),
                 radial-gradient(ellipse at 20% 80%,rgba(255,107,26,.12) 0%,transparent 50%),var(--bg)}
    .auth-box{background:var(--bg2);border:1px solid rgba(123,79,212,.25);border-radius:20px;padding:40px 36px;width:100%;max-width:400px}
    .auth-logo{display:flex;align-items:center;gap:14px;margin-bottom:32px}
    .auth-logo-icon{width:52px;height:52px;background:linear-gradient(135deg,var(--purple),var(--orange));border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 20px rgba(123,79,212,.4)}
    .auth-logo h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1.2rem;letter-spacing:.04em;background:linear-gradient(90deg,#fff 40%,var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .auth-logo span{font-size:.72rem;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase}
    .auth-tabs{display:flex;gap:4px;background:var(--bg);border-radius:10px;padding:4px;margin-bottom:28px}
    .auth-tab{flex:1;padding:8px;border-radius:8px;border:none;background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s}
    .auth-tab.active{background:var(--bg3);color:var(--text)}
    .auth-form{display:flex;flex-direction:column;gap:14px}
    .auth-form input{background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
    .auth-form input:focus{border-color:var(--purple)}
    .auth-submit{padding:12px;background:linear-gradient(135deg,var(--purple),var(--orange));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:opacity .2s}
    .auth-submit:hover{opacity:.88}
    .auth-error{font-size:.78rem;color:var(--loss);background:rgba(255,77,106,.1);border-radius:8px;padding:8px 12px;text-align:center}
    .auth-success{font-size:.78rem;color:var(--profit);background:rgba(61,214,140,.1);border-radius:8px;padding:8px 12px;text-align:center}

    /* SETUP */
    #setup-screen{min-height:100vh;display:none;align-items:center;justify-content:center;
      background:radial-gradient(ellipse at 60% 20%,rgba(123,79,212,.18) 0%,transparent 60%),var(--bg)}
    .setup-box{background:var(--bg2);border:1px solid rgba(255,107,26,.3);border-radius:20px;padding:40px 36px;width:100%;max-width:500px}
    .setup-box h2{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--orange);margin-bottom:8px}
    .setup-box p{font-size:.82rem;color:var(--text-dim);margin-bottom:24px;line-height:1.6}
    .setup-field{margin-bottom:14px}
    .setup-field label{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);margin-bottom:6px;font-weight:600}
    .setup-field input{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s}
    .setup-field input:focus{border-color:var(--orange)}
    .setup-hint{font-size:.7rem;color:var(--text-dim);margin-top:5px}
    .setup-hint a{color:var(--purple-light)}
    .setup-submit{width:100%;padding:12px;background:linear-gradient(135deg,var(--orange),var(--purple));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.08em;cursor:pointer;margin-top:8px}

    /* APP */
    #app-screen{display:none}
    header{background:linear-gradient(135deg,#0D0F1A 0%,#1A1035 50%,#0D1520 100%);border-bottom:1px solid rgba(123,79,212,.3);padding:16px 24px;position:relative}
    .header-top{display:flex;align-items:center;gap:14px;margin-bottom:18px;position:sticky;top:0;z-index:200;background:linear-gradient(135deg,#0D0F1A 0%,#1A1035 60%,#0D1520 100%);margin-left:-24px;margin-right:-24px;padding:12px 24px;border-bottom:1px solid rgba(123,79,212,.2)}
    .hamburger-btn{background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 12px;color:var(--chrome);font-size:1.1rem;cursor:pointer;flex-shrink:0}
    .hamburger-btn:hover{background:rgba(255,255,255,.08)}
    .header-profile-btn{margin-left:auto;display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(123,79,212,.3);border-radius:30px;padding:5px 14px 5px 5px;cursor:pointer;transition:all .2s;flex-shrink:0}
    .header-profile-btn:hover{background:rgba(123,79,212,.18);border-color:rgba(123,79,212,.5)}
    .header-profile-avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--orange));display:flex;align-items:center;justify-content:center;font-size:1.15rem;flex-shrink:0;box-shadow:0 2px 8px rgba(123,79,212,.4)}
    .header-profile-pseudo{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;color:var(--text);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    header::before{content:'';position:absolute;top:-60px;right:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(123,79,212,.15) 0%,transparent 70%);pointer-events:none;z-index:0}
    .logo-img{width:52px;height:52px;border-radius:12px;overflow:hidden;flex-shrink:0;box-shadow:0 4px 20px rgba(123,79,212,.4);position:relative}
    .logo-img img{width:100%;height:100%;object-fit:cover}
    .logo-img .logo-fallback{display:none;width:100%;height:100%;background:linear-gradient(135deg,var(--purple),var(--orange));align-items:center;justify-content:center;font-size:22px;position:absolute;top:0;left:0}
    .logo-icon{width:46px;height:46px;background:linear-gradient(135deg,var(--purple),var(--orange));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;box-shadow:0 4px 20px rgba(123,79,212,.4)}
    .header-titles h1{font-family:'Orbitron',sans-serif;font-weight:900;font-size:1rem;letter-spacing:.04em;background:linear-gradient(90deg,#fff 40%,var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1}
    .header-titles span{font-size:.72rem;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase}
    .header-user{margin-left:auto;display:flex;align-items:center;gap:10px}
    .user-email{font-size:.72rem;color:var(--text-dim);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .signout-btn{padding:5px 12px;border-radius:8px;border:1px solid rgba(255,77,106,.3);background:transparent;color:var(--missing);font-size:.72rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s}
    .signout-btn:hover{background:rgba(255,77,106,.1)}

    /* STATS BAR */
    .header-bottom{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
    .energy-section{flex:1;min-width:240px}
    .energy-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
    .energy-label .elabel{font-size:.7rem;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);font-weight:500}
    .energy-label .pct{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:var(--orange)}
    .energy-bar-bg{height:10px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden}
    .energy-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--purple),var(--orange));transition:width .6s cubic-bezier(.4,0,.2,1);position:relative}
    .energy-bar-fill::after{content:'';position:absolute;top:0;right:0;bottom:0;width:20px;background:rgba(255,255,255,.3);border-radius:0 5px 5px 0;filter:blur(3px)}
    .energy-counts{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
    .rank-section{display:flex;align-items:center;gap:12px;margin-top:10px;padding:8px 12px;background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.07)}
    .rank-icon{font-size:1.6rem;line-height:1}
    .rank-info{}
    .rank-name{font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:700}
    .rank-bronze{color:#CD7F32}
    .rank-argent{color:#C0C0C0}
    .rank-or{color:#FFD700}
    .rank-platine{color:#E5E4E2}
    .rank-diamant{color:#B9F2FF}
    .rank-next{font-size:.65rem;color:var(--text-dim);margin-top:2px}
    .rank-bar-bg{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;width:140px}
    .rank-bar-fill{height:100%;border-radius:3px;transition:width .6s}
    .ecount{display:flex;align-items:center;gap:5px;font-size:.72rem;color:var(--text-dim)}
    .ecount .dot{width:7px;height:7px;border-radius:50%}
    .ecount .num{font-weight:600;color:var(--text)}
    .finance-stats{display:flex;gap:10px;flex-wrap:wrap}
    .fstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 14px;min-width:100px;text-align:center}
    .fstat .flabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);margin-bottom:3px}
    .fstat .fvalue{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700}
    .fstat .fvalue.invested{color:var(--chrome)}
    .fstat .fvalue.current-val{color:var(--purple-light)}
    .fstat .fvalue.profit-pos{color:var(--profit)}
    .fstat .fvalue.profit-neg{color:var(--loss)}
    .fstat .fvalue.profit-zero{color:var(--neutral)}

    /* CONTROLS */
    .controls{padding:12px 32px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.05)}
    .filter-group{display:flex;gap:5px;flex-wrap:wrap}
    .filter-btn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-size:.74rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;font-weight:500}
    .filter-btn:hover{border-color:var(--purple);color:var(--text)}
    .filter-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}
    .filter-btn.s-owned.active{background:var(--owned);border-color:var(--owned);color:#0D0F1A}
    .filter-btn.s-wish.active{background:var(--wishlist);border-color:var(--wishlist);color:#0D0F1A}
    .filter-btn.s-miss.active{background:var(--missing);border-color:var(--missing);color:#fff}
    .spacer{flex:1}
    .controls-sep{width:1px;background:rgba(255,255,255,.1);margin:0 6px;align-self:stretch}
    .filter-label{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);font-weight:600;padding:0 4px;align-self:center}
    .add-btn{padding:11px 22px;background:linear-gradient(135deg,var(--purple),var(--orange));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:opacity .2s,transform .15s,box-shadow .2s;box-shadow:0 4px 16px rgba(123,79,212,.45);animation:addPulse 2.6s ease-in-out infinite}
    .add-btn:hover{transform:translateY(-2px);box-shadow:0 6px 22px rgba(255,107,26,.5)}
    @keyframes addPulse{0%,100%{box-shadow:0 4px 16px rgba(123,79,212,.45)}50%{box-shadow:0 4px 22px rgba(255,107,26,.55)}}
    .add-btn:hover{opacity:.88;transform:translateY(-1px)}

    /* GRID */
    .grid-container{padding:22px 32px}
    .category-section{margin-bottom:32px}
    .cat-header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .cat-toggle{cursor:pointer;user-select:none;padding:8px 10px;border-radius:10px;transition:background .15s}
    .cat-toggle:hover{background:rgba(255,255,255,.04)}
    .cat-chevron{font-size:.7rem;color:var(--purple-light);transition:transform .2s;flex-shrink:0}
    .cat-toggle.collapsed .cat-chevron{transform:rotate(-90deg)}
    .cat-toggle .cat-count{background:var(--bg3);padding:2px 10px;border-radius:12px}
    .cat-icon{font-size:1.1rem}
    .cat-title{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;color:var(--chrome);text-transform:uppercase}
    .cat-count{font-size:.7rem;color:var(--text-dim);background:rgba(255,255,255,.06);padding:2px 8px;border-radius:10px}
    .cat-divider{flex:1;height:1px;background:linear-gradient(90deg,rgba(123,79,212,.3),transparent)}
    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}

    /* CARD */
    .item-card{background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:var(--r);padding:0;transition:border-color .2s,transform .15s;overflow:hidden}
    .item-card:hover{border-color:rgba(123,79,212,.35);transform:translateY(-2px)}
    .item-card.owned{border-left:3px solid var(--owned)}
    .item-card.wishlist{border-left:3px solid var(--wishlist)}
    .item-card.missing{border-left:3px solid var(--missing)}
    .card-cover{width:100%;height:160px;overflow:hidden;background:var(--bg3);display:flex;align-items:center;justify-content:center;position:relative}
    .card-cover img{width:100%;height:100%;object-fit:contain;background:var(--bg3)}
    .card-cover .no-img{font-size:3rem;opacity:.2}
    .card-body{padding:12px}
    .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:7px}
    .card-emoji{font-size:1.3rem;line-height:1}
    .card-badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
    .badge{font-size:.58rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px}
    .badge.owned{background:rgba(61,214,140,.15);color:var(--owned)}
    .badge.wishlist{background:rgba(255,212,71,.15);color:var(--wishlist)}
    .badge.missing{background:rgba(255,77,106,.15);color:var(--missing)}
    .badge.cond-new{background:rgba(123,79,212,.2);color:var(--purple-light)}
    .badge.cond-used{background:rgba(255,107,26,.15);color:var(--orange-light)}
    .badge.cond-blister{background:rgba(61,214,140,.1);color:var(--owned)}
    .badge.region{background:rgba(255,255,255,.07);color:var(--chrome)}
    .badge.platform{background:rgba(196,200,212,.1);color:var(--chrome)}
    .card-name{font-weight:600;font-size:.86rem;line-height:1.3;margin-bottom:2px}
    .card-meta{font-size:.68rem;color:var(--text-dim);margin-bottom:5px;display:flex;gap:8px;flex-wrap:wrap}
    .card-meta span{display:flex;align-items:center;gap:3px}
    .card-note{font-size:.7rem;color:var(--text-dim);margin-bottom:6px;font-style:italic}
    /* COMPLETENESS */
    .card-completeness{display:flex;gap:4px;margin:6px 0;flex-wrap:wrap}
    .comp-chip{display:flex;align-items:center;gap:3px;font-size:.6rem;font-weight:600;padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.08)}
    .comp-chip.has,.comp-chip.present{background:rgba(61,214,140,.1);color:var(--owned);border-color:rgba(61,214,140,.3)}
    .comp-chip.no,.comp-chip.absent{background:rgba(255,77,106,.15);color:var(--missing);border-color:rgba(255,77,106,.4);font-weight:700}
    .comp-chip.na{background:rgba(255,255,255,.04);color:var(--text-dim);border-color:rgba(255,255,255,.08)}
    /* STARS */
    .card-stars{display:flex;gap:1px;margin:4px 0;align-items:center}
    .card-stars span{font-size:.8rem}
    .card-stars .rating-label{font-size:.62rem;color:var(--text-dim);margin-left:4px}
    /* PRICES */
    .card-prices{display:flex;gap:5px;margin:7px 0}
    .price-chip{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:6px;padding:4px 7px;text-align:center}
    .price-chip .plabel{font-size:.56rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:1px}
    .price-chip .pval{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;color:var(--chrome)}
    .price-chip .pval.no-price{color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.68rem;font-weight:400}
    .card-delta{display:flex;align-items:center;gap:4px;font-size:.68rem;font-weight:600;margin-bottom:5px;padding:2px 7px;border-radius:5px;width:fit-content}
    .card-delta.pos{background:rgba(61,214,140,.12);color:var(--profit)}
    .card-delta.neg{background:rgba(255,77,106,.12);color:var(--loss)}
    .card-delta.zero{background:rgba(255,255,255,.05);color:var(--neutral)}
    /* ACTIONS */
    .card-actions{display:flex;gap:4px;margin-top:8px}
    .action-btn{flex:1;padding:5px 0;border-radius:6px;border:1px solid rgba(255,255,255,.08);background:transparent;font-size:.62rem;font-weight:600;cursor:pointer;color:var(--text-dim);transition:all .15s;font-family:'Inter',sans-serif}
    .action-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .action-btn.set-owned:hover{border-color:var(--owned);color:var(--owned)}
    .action-btn.set-wish:hover{border-color:var(--wishlist);color:var(--wishlist)}
    .action-btn.set-miss:hover{border-color:var(--missing);color:var(--missing)}
    .action-btn.edit-btn:hover{border-color:var(--purple-light);color:var(--purple-light)}
    .action-btn.del-btn:hover{border-color:rgba(255,77,106,.4);color:var(--missing)}

    /* MODAL */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
    .modal-overlay.open{display:flex}
    .modal{background:var(--bg3);border:1px solid rgba(123,79,212,.3);border-radius:18px;padding:26px;width:100%;max-width:520px;position:relative;max-height:94vh;overflow-y:auto}
    .modal h2{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.08em;margin-bottom:18px;color:var(--purple-light)}
    .modal-close{position:absolute;top:16px;right:16px;background:transparent;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer}
    .form-section{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:12px;margin-bottom:12px}
    .form-section-title{font-size:.65rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);font-weight:700;margin-bottom:10px}
    .form-group{margin-bottom:10px}
    .form-group:last-child{margin-bottom:0}
    .form-group label{display:block;font-size:.67rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:4px;font-weight:600}
    .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 10px;color:var(--text);font-family:'Inter',sans-serif;font-size:.85rem;outline:none;transition:border-color .2s}
    .form-group input:focus,.form-group select:focus{border-color:var(--purple)}
    .form-group select option{background:var(--bg3)}
    .form-group textarea{resize:vertical;min-height:52px}
    .form-row{display:flex;gap:8px}
    .form-row .form-group{flex:1}
    .price-hint{font-size:.63rem;color:var(--text-dim);margin-top:3px}
    /* COMPLETENESS CHECKS */
    .completeness-checks{display:flex;gap:6px;flex-wrap:wrap}
    .check-item{display:flex;align-items:center;gap:6px;cursor:pointer}
    .check-item input[type=checkbox]{display:none}
    .check-box{width:26px;height:26px;border-radius:6px;border:2px solid rgba(255,255,255,.15);background:transparent;display:flex;align-items:center;justify-content:center;font-size:.85rem;transition:all .15s;flex-shrink:0}
    .check-item input:checked+.check-box{border-color:var(--owned);background:rgba(61,214,140,.15)}
    .check-label{font-size:.74rem;color:var(--text-dim);font-weight:500}
    /* STARS INPUT */
    .star-input{display:flex;gap:4px;padding:2px 0}
    .star-input .star{font-size:1.2rem;cursor:pointer;opacity:.3;transition:opacity .15s}
    .star-input .star.on{opacity:1}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
    .btn-cancel{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.82rem;cursor:pointer}
    .btn-save{padding:8px 18px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--purple),var(--orange));color:#fff;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.06em;cursor:pointer}

    /* TOAST */
    /* DETAIL MODAL */
    .detail-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
    .detail-overlay.open{display:flex}
    .detail-modal{background:var(--bg2);border:1px solid rgba(123,79,212,.3);border-radius:20px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;position:relative}
    .detail-cover{width:100%;height:280px;overflow:hidden;background:var(--bg3);position:relative;display:flex;align-items:center;justify-content:center}
    .detail-cover img{width:100%;height:100%;object-fit:contain;background:var(--bg3)}
    .detail-cover .no-cover{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:5rem;opacity:.2;background:linear-gradient(135deg,var(--bg3),var(--bg))}
    .detail-cover-gradient{position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg2))}
    .detail-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.5);border:none;color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
    .detail-body{padding:20px 24px 24px}
    .detail-header{margin-bottom:16px}
    .detail-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
    .detail-name{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;line-height:1.3;margin-bottom:4px}
    .detail-meta{font-size:.75rem;color:var(--text-dim);display:flex;gap:12px;flex-wrap:wrap}
    .detail-meta span{display:flex;align-items:center;gap:4px}
    .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .detail-block{background:var(--bg3);border-radius:10px;padding:12px}
    .detail-block .dblabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--text-dim);margin-bottom:6px;font-weight:600}
    .detail-block .dbvalue{font-size:.85rem;font-weight:600;color:var(--text)}
    .detail-block.full{grid-column:1/-1}
    .detail-completeness{display:flex;gap:6px;flex-wrap:wrap}
    .detail-prices{display:flex;gap:8px}
    .detail-price-box{flex:1;text-align:center;background:rgba(255,255,255,.04);border-radius:8px;padding:10px}
    .detail-price-box .dplabel{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-bottom:4px}
    .detail-price-box .dpvalue{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:700;color:var(--chrome)}
    .detail-delta{text-align:center;margin-top:8px;font-size:.8rem;font-weight:600}
    .detail-stars{font-size:1.2rem}
    .detail-actions{display:flex;gap:8px;margin-top:16px}
    .detail-btn{flex:1;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
    .detail-btn:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .detail-btn.edit{border-color:var(--purple-light);color:var(--purple-light)}
    .detail-btn.edit:hover{background:rgba(123,79,212,.15)}
    .detail-btn.wish-link{border-color:var(--wishlist);color:var(--wishlist)}
    .detail-btn.wish-link:hover{background:rgba(255,212,71,.1)}
    /* PROFILE */
    .profile-btn{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--orange));border:2px solid rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;cursor:pointer;transition:transform .2s,border-color .2s;flex-shrink:0}
    .profile-btn:hover{transform:scale(1.08);border-color:rgba(255,255,255,.4)}
    .profile-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto}
    .profile-screen.open{display:block}
    .profile-header{background:linear-gradient(135deg,#0D0F1A 0%,#1A1035 60%,#0D1520 100%);padding:32px;position:relative;border-bottom:1px solid rgba(123,79,212,.3)}
    .profile-back{position:absolute;top:20px;left:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:7px 14px;color:var(--text-dim);font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
    .profile-back:hover{background:rgba(255,255,255,.15);color:var(--text)}
    .profile-hero{display:flex;align-items:center;gap:24px;margin-top:16px}
    .profile-avatar-big{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--orange));border:3px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:2.5rem;cursor:pointer;transition:transform .2s;flex-shrink:0}
    .profile-avatar-big:hover{transform:scale(1.05)}
    .profile-hero-info{}
    .profile-pseudo{font-family:'Orbitron',sans-serif;font-size:1.4rem;font-weight:900;background:linear-gradient(90deg,#fff 40%,var(--purple-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .profile-email-small{font-size:.75rem;color:var(--text-dim);margin-top:2px}
    .profile-rank-display{display:flex;align-items:center;gap:10px;margin-top:10px;background:rgba(255,255,255,.05);border-radius:10px;padding:10px 16px;width:fit-content}
    .profile-rank-icon{font-size:1.8rem}
    .profile-rank-name{font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:700}
    .profile-rank-progress{font-size:.68rem;color:var(--text-dim);margin-top:2px}
    .profile-rank-bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:5px;width:180px}
    .profile-rank-fill{height:100%;border-radius:3px;transition:width .8s}
    .profile-body{padding:28px 32px}
    .profile-section{margin-bottom:28px}
    .profile-section-title{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.1em;color:var(--chrome);text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .profile-section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(123,79,212,.3),transparent)}
    /* PSEUDO EDIT */
    .pseudo-edit{display:flex;gap:8px;align-items:center}
    .pseudo-input{flex:1;background:var(--bg2);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 14px;color:var(--text);font-family:'Orbitron',sans-serif;font-size:.9rem;outline:none;transition:border-color .2s}
    .pseudo-input:focus{border-color:var(--purple)}
    .pseudo-save{padding:10px 18px;background:linear-gradient(135deg,var(--purple),var(--orange));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;cursor:pointer;white-space:nowrap}
    /* AVATAR PICKER */
    .avatar-grid{display:flex;gap:10px;flex-wrap:wrap}
    .avatar-opt{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:1.5rem;cursor:pointer;transition:all .2s}
    .avatar-opt:hover{border-color:var(--purple);transform:scale(1.1)}
    .avatar-opt.selected{border-color:var(--orange);background:rgba(255,107,26,.15)}
    /* STATS GRID */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
    .stat-card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .stat-card .sicon{font-size:1.8rem;margin-bottom:6px}
    .stat-card .svalue{font-family:'Orbitron',sans-serif;font-size:1.2rem;font-weight:700;color:var(--text)}
    .stat-card .slabel{font-size:.65rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-top:3px}
    /* TOP ITEMS */
    .top-items{display:flex;flex-direction:column;gap:8px}
    .top-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:10px 14px}
    .top-item .ti-rank{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:var(--text-dim);width:24px;flex-shrink:0}
    .top-item .ti-name{flex:1;font-size:.82rem;font-weight:600}
    .top-item .ti-val{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;color:var(--purple-light)}
    /* TYPE BREAKDOWN */
    .type-bars{display:flex;flex-direction:column;gap:8px}
    .type-bar-row{display:flex;align-items:center;gap:10px}
    .type-bar-label{font-size:.75rem;color:var(--text-dim);width:160px;flex-shrink:0}
    .type-bar-bg{flex:1;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
    .type-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--purple),var(--orange));transition:width .6s}
    .type-bar-count{font-size:.72rem;color:var(--text);font-weight:600;width:30px;text-align:right;flex-shrink:0}
    /* CLOUDINARY GALLERY */
    .gallery-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:600;align-items:center;justify-content:center;backdrop-filter:blur(6px)}
    .gallery-overlay.open{display:flex}
    .gallery-modal{background:var(--bg2);border:1px solid rgba(123,79,212,.3);border-radius:18px;width:100%;max-width:1000px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
    .gallery-header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px}
    .gallery-header h3{font-family:'Orbitron',sans-serif;font-size:.88rem;font-weight:700;color:var(--purple-light);flex:1}
    .gallery-close{background:transparent;border:none;color:var(--text-dim);font-size:1.1rem;cursor:pointer}
    .gallery-folders{display:flex;gap:6px;padding:12px 22px;border-bottom:1px solid rgba(255,255,255,.05);flex-wrap:wrap}
    .gallery-folder-btn{padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-size:.74rem;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s}
    .gallery-folder-btn:hover{border-color:var(--purple);color:var(--text)}
    .gallery-folder-btn.active{background:var(--purple);border-color:var(--purple);color:#fff}
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:300px;gap:14px;padding:16px 20px;overflow-y:auto;flex:1;max-height:66vh;align-items:stretch}
    .gallery-item{border-radius:10px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s, box-shadow .2s;background:var(--bg3);display:flex;flex-direction:column;align-items:center;height:100%}
    .gallery-item:hover{border-color:var(--purple);box-shadow:0 0 12px rgba(123,79,212,.3)}
    .gallery-item.selected{border-color:var(--orange);box-shadow:0 0 12px rgba(255,107,26,.4)}
    .gallery-item .gallery-thumb{width:100%;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:8px;box-sizing:border-box}
    .gallery-item .gallery-thumb-empty::after{content:'🖼️';font-size:2rem;opacity:.3}
    .gallery-item .gallery-thumb img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
    .gallery-empty{text-align:center;padding:40px;color:var(--text-dim);font-size:.82rem;grid-column:1/-1}
    .gallery-footer{padding:14px 22px;border-top:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center;gap:10px}
    .gallery-selected-preview{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--text-dim)}
    .gallery-selected-preview img{width:32px;height:40px;object-fit:contain;border-radius:4px;border:1px solid rgba(255,255,255,.1)}
    .gallery-confirm{padding:8px 18px;background:linear-gradient(135deg,var(--purple),var(--orange));border:none;border-radius:8px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.7rem;font-weight:700;cursor:pointer}
    .gallery-cancel{padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-family:'Inter',sans-serif;font-size:.78rem;cursor:pointer}
    /* ADMIN PANEL */
    body.has-bnav .admin-screen,body.has-bnav .stats-screen{padding-bottom:80px}
    .admin-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto}
    .admin-screen.open{display:block}
    .admin-header{background:linear-gradient(135deg,#0D0F1A,#1A1035);border-bottom:1px solid rgba(255,107,26,.3);padding:20px 32px;display:flex;align-items:center;gap:14px}
    .admin-header h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--orange);flex:1}
    .admin-back{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif}
    .admin-body{padding:28px 32px;max-width:900px;margin:0 auto}
    .admin-section{margin-bottom:32px}
    .admin-section-title{font-family:'Orbitron',sans-serif;font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--orange);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    .admin-section-title::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(255,107,26,.3),transparent)}
    .admin-form{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:20px}
    .admin-form .form-row{display:flex;gap:10px;flex-wrap:wrap}
    .admin-form .form-group{flex:1;min-width:160px;margin-bottom:10px}
    .admin-submit{padding:10px 20px;background:linear-gradient(135deg,var(--orange),var(--purple));border:none;border-radius:8px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;margin-top:8px}
    /* IMAGES TABLE */
    .admin-images-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:16px}
    .admin-img-card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;overflow:hidden;position:relative}
    .admin-img-card img{width:100%;height:120px;object-fit:contain;background:var(--bg3)}
    .admin-img-info{padding:8px}
    .admin-img-name{font-size:.72rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .admin-img-meta{font-size:.62rem;color:var(--text-dim);margin-top:2px}
    .admin-img-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,77,106,.8);border:none;color:#fff;font-size:.7rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
    .admin-img-edit{position:absolute;top:4px;right:30px;width:22px;height:22px;border-radius:50%;background:rgba(123,79,212,.85);border:none;color:#fff;font-size:.66rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
    .admin-img-edit:hover{background:rgba(123,79,212,1)}
    /* SUBMISSIONS TABLE */
    .admin-sub-list{display:flex;flex-direction:column;gap:10px}
    .admin-sub-card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:14px;display:flex;gap:14px;align-items:flex-start}
    .admin-sub-img{width:60px;height:80px;object-fit:contain;border-radius:6px;background:var(--bg3);flex-shrink:0}
    .admin-sub-info{flex:1}
    .admin-sub-name{font-weight:600;font-size:.85rem;margin-bottom:4px}
    .admin-sub-meta{font-size:.72rem;color:var(--text-dim);margin-bottom:8px}
    .admin-sub-actions{display:flex;gap:6px}
    .admin-sub-btn{padding:5px 12px;border-radius:6px;border:none;font-size:.7rem;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif}
    .admin-sub-btn.approve{background:rgba(61,214,140,.2);color:var(--owned);border:1px solid rgba(61,214,140,.3)}
    .admin-sub-btn.reject{background:rgba(255,77,106,.15);color:var(--missing);border:1px solid rgba(255,77,106,.3)}
    /* STATS PAGE */
    .stats-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto}
    .stats-screen.open{display:block}
    .stats-page-header{background:linear-gradient(135deg,#0D0F1A,#1A1035);border-bottom:1px solid rgba(123,79,212,.3);padding:20px 32px;display:flex;align-items:center;gap:14px}
    .stats-page-header h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--purple-light);flex:1}
    .stats-back{padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:transparent;color:var(--text-dim);font-size:.78rem;cursor:pointer;font-family:'Inter',sans-serif}
    .stats-body{padding:28px 32px;max-width:1100px;margin:0 auto}
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-bottom:24px}
    .stats-grid.full{grid-template-columns:1fr}
    .stats-grid.two{grid-template-columns:1fr 1fr}
    @media(max-width:760px){
      .stats-grid,.stats-grid.two,.stats-grid.full{grid-template-columns:1fr}
      .stats-body{padding:20px 14px}
      .kpi-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
      .bar-label,.type-bar-label{width:96px;font-size:.66rem}
      .stat-widget{padding:14px}
      .stats-page-header{padding:16px 14px}
    }
    .stat-widget{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:20px}
    .stat-widget-title{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--chrome);text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:8px}
    /* KPI CARDS */
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:24px}
    .kpi-card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;text-align:center}
    .kpi-card .kpi-icon{font-size:1.4rem;margin-bottom:4px}
    .kpi-card .kpi-value{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700;color:var(--text);line-height:1.2}
    .kpi-card .kpi-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-top:4px}
    /* PIE CHART */
    .pie-container{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .pie-legend{display:flex;flex-direction:column;gap:8px;flex:1}
    .pie-legend-item{display:flex;align-items:center;gap:8px;font-size:.78rem}
    .pie-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .pie-legend-label{flex:1;color:var(--text-dim)}
    .pie-legend-val{font-weight:600;color:var(--text)}
    .pie-legend-pct{font-size:.68rem;color:var(--text-dim)}
    /* BAR CHART */
    .bar-chart{display:flex;flex-direction:column;gap:10px}
    .bar-row{display:flex;align-items:center;gap:10px}
    .bar-label{font-size:.72rem;color:var(--text-dim);width:160px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .bar-bg{flex:1;height:22px;background:rgba(255,255,255,.06);border-radius:5px;overflow:hidden;position:relative}
    .bar-fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.4,0,.2,1);display:flex;align-items:center;padding-left:8px}
    .bar-fill-label{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.9);white-space:nowrap}
    .bar-val{font-size:.72rem;font-weight:600;color:var(--text);width:60px;text-align:right;flex-shrink:0}
    /* DONUT */
    .donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
    .donut-legend{flex:1;display:flex;flex-direction:column;gap:8px}
    /* TOP LIST */
    .top-list{display:flex;flex-direction:column;gap:8px}
    .top-list-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:8px}
    .top-list-rank{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;color:var(--text-dim);width:24px;text-align:center;flex-shrink:0}
    .top-list-icon{font-size:1rem;flex-shrink:0}
    .top-list-namewrap{flex:1;overflow:hidden}
    .top-list-name{font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .top-list-variant{font-size:.66rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
    .top-list-val{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;color:var(--purple-light);flex-shrink:0}
    /* COMPLETENESS */
    .comp-summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
    .comp-badge{flex:1;min-width:80px;text-align:center;padding:10px;background:var(--bg3);border-radius:10px}
    .comp-badge .cv{font-family:'Orbitron',sans-serif;font-size:1.1rem;font-weight:700}
    .comp-badge .cl{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);margin-top:3px}
    .comp-alert-list{display:flex;flex-direction:column;gap:6px;max-height:250px;overflow-y:auto}
    .comp-alert{display:flex;align-items:center;gap:8px;padding:7px 10px;background:rgba(255,77,106,.07);border:1px solid rgba(255,77,106,.15);border-radius:8px;font-size:.75rem}
    .comp-alert-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .comp-alert-missing{color:var(--missing);font-size:.68rem}
    /* PROFILE SCREEN */
    .profile-rank-icon{font-size:2rem;flex-shrink:0}
    .profile-rank-name{font-family:'Orbitron',sans-serif;font-size:.85rem;font-weight:700}
    .profile-rank-progress{font-size:.7rem;color:var(--text-dim);margin-top:3px}
    .profile-rank-bar{height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;margin-top:8px;width:200px}
    .profile-rank-fill{height:100%;border-radius:3px;transition:width .8s}
    .type-bar-row{display:flex;align-items:center;gap:8px}
    .type-bar-label{font-size:.72rem;color:var(--text-dim);width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
    .type-bar-bg{flex:1;height:18px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden}
    .type-bar-fill{height:100%;background:linear-gradient(90deg,var(--purple),var(--orange));border-radius:4px}
    .type-bar-count{font-size:.72rem;font-weight:600;color:var(--text);width:40px;text-align:right;flex-shrink:0}
    .top-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg3);border-radius:8px;margin-bottom:6px}
    .ti-rank{font-family:'Orbitron',sans-serif;font-size:.75rem;font-weight:700;color:var(--text-dim);width:24px;text-align:center;flex-shrink:0}
    .ti-name{flex:1;font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ti-val{font-family:'Orbitron',sans-serif;font-size:.78rem;font-weight:700;color:var(--purple-light);flex-shrink:0}
    .avatar-opt{width:44px;height:44px;border-radius:50%;background:var(--bg3);border:2px solid transparent;display:flex;align-items:center;justify-content:center;font-size:1.4rem;cursor:pointer;transition:all .2s}
    .avatar-opt.selected{border-color:var(--purple);background:rgba(123,79,212,.2)}
    .avatar-opt:hover{border-color:rgba(123,79,212,.5)}
    /* MARKETPLACE */
    .market-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:400;overflow-y:auto}
    .market-screen.open{display:block}
    .market-header{background:linear-gradient(135deg,#0D0F1A,#1A1035);border-bottom:1px solid rgba(61,214,140,.3);padding:20px 32px;display:flex;align-items:center;gap:14px}
    .market-header h1{font-family:'Orbitron',sans-serif;font-size:1rem;font-weight:900;color:var(--owned);flex:1}
    .market-body{padding:24px 32px;max-width:1000px;margin:0 auto}
    .market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
    .market-card{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:12px;overflow:hidden;transition:transform .2s,border-color .2s}
    .market-card:hover{transform:translateY(-2px);border-color:rgba(61,214,140,.3)}
    .market-card-img{width:100%;height:140px;object-fit:contain;background:var(--bg3)}
    .market-card-body{padding:12px}
    .market-card-name{font-size:.85rem;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .market-card-meta{font-size:.68rem;color:var(--text-dim);margin-bottom:8px}
    .market-card-type{display:inline-block;padding:3px 8px;border-radius:6px;font-size:.62rem;font-weight:700;margin-bottom:8px}
    .market-card-type.exchange{background:rgba(123,79,212,.2);color:var(--purple-light);border:1px solid rgba(123,79,212,.3)}
    .market-card-type.sale{background:rgba(255,212,71,.15);color:var(--wishlist);border:1px solid rgba(255,212,71,.3)}
    .market-card-type.gift{background:rgba(61,214,140,.15);color:var(--owned);border:1px solid rgba(61,214,140,.3)}
    .market-card-looking{font-size:.72rem;color:var(--text-dim);margin-bottom:10px;font-style:italic}
    .market-card-owner{font-size:.7rem;color:var(--chrome);margin-bottom:10px;display:flex;align-items:center;gap:5px}
    .market-contact-btn{width:100%;padding:8px;background:linear-gradient(135deg,var(--owned),#00B89C);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:.65rem;font-weight:700;cursor:pointer;letter-spacing:.05em}
    /* EXCHANGE MODAL */
    .exchange-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;align-items:center;justify-content:center}
    .exchange-modal.open{display:flex}
    .exchange-box{background:var(--bg2);border:1px solid rgba(61,214,140,.3);border-radius:16px;padding:28px;max-width:480px;width:90%;max-height:90vh;overflow-y:auto}
    .exchange-box h3{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:var(--owned);margin-bottom:16px}
    .exchange-consent{background:rgba(255,212,71,.08);border:1px solid rgba(255,212,71,.2);border-radius:10px;padding:12px;font-size:.75rem;color:var(--text-dim);margin-bottom:16px;line-height:1.5}
    .exchange-form-group{margin-bottom:14px}
    .exchange-form-group label{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);font-weight:600;display:block;margin-bottom:5px}
    .exchange-input{width:100%;background:var(--bg3);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:8px 12px;color:var(--text);font-family:Inter,sans-serif;font-size:.82rem;outline:none}
    .exchange-submit{width:100%;padding:11px;background:linear-gradient(135deg,var(--owned),#00B89C);border:none;border-radius:8px;color:#fff;font-family:Orbitron,sans-serif;font-size:.72rem;font-weight:700;cursor:pointer;margin-top:8px}
    .exchange-cancel{width:100%;padding:8px;background:transparent;border:1px solid rgba(255,255,255,.1);border-radius:8px;color:var(--text-dim);font-family:Inter,sans-serif;font-size:.75rem;cursor:pointer;margin-top:8px}
    /* FIXED FOOTER */
    .fixed-footer{
      position:fixed;bottom:0;left:0;right:0;z-index:999;
      background:linear-gradient(transparent,rgba(13,15,26,.95));
      padding:8px 16px 10px;
      display:flex;align-items:center;justify-content:center;gap:16px;
      pointer-events:none;
    }
    .fixed-footer a, .fixed-footer button{pointer-events:all}
    .footer-kofi{
      display:inline-flex;align-items:center;gap:6px;
      padding:6px 14px;
      background:linear-gradient(135deg,#FF5E5B,#FF8C42);
      border-radius:20px;color:#fff;text-decoration:none;
      font-family:Orbitron,sans-serif;font-size:.62rem;font-weight:700;
      letter-spacing:.05em;box-shadow:0 2px 10px rgba(255,94,91,.4);
      border:none;cursor:pointer;
    }
    .footer-legal{
      font-size:.58rem;color:var(--text-dim);text-decoration:none;
    }
    .footer-legal:hover{color:var(--text)}
    /* Add bottom padding to all screens */
    /* CATALOG */
    .catalog-suggest-btn{padding:8px 18px;border-radius:20px;background:rgba(255,255,255,.06);border:1px dashed rgba(120,210,235,.4);color:var(--cyan,#78D2EB);font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s}
    .catalog-suggest-btn:hover{background:rgba(120,210,235,.12);border-style:solid}
    .sg-review-row{background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:12px;margin-bottom:10px}
    .sg-review-row .sg-r-name{font-weight:600;color:var(--text);font-size:.9rem}
    .sg-review-row .sg-r-meta{font-size:.74rem;color:var(--text-dim);margin:3px 0}
    .sg-review-actions{display:flex;gap:8px;margin-top:8px}
    .sg-btn-approve{flex:1;padding:8px;background:rgba(120,217,82,.15);border:1px solid rgba(120,217,82,.4);border-radius:8px;color:#9ee05a;cursor:pointer;font-size:.78rem;font-weight:600}
    .sg-btn-reject{flex:1;padding:8px;background:rgba(255,77,106,.12);border:1px solid rgba(255,77,106,.35);border-radius:8px;color:var(--missing);cursor:pointer;font-size:.78rem;font-weight:600}
    .catalog-wrap{max-width:900px;margin:0 auto}
    .catalog-intro{color:var(--text-dim);font-size:.88rem;text-align:center;margin-bottom:18px}
    .catalog-cats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
    .catalog-cat{padding:7px 14px;border-radius:20px;background:var(--bg3);border:1px solid rgba(255,255,255,.1);color:var(--text-dim);font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Inter',sans-serif}
    .catalog-cat:hover{border-color:var(--purple)}
    .catalog-cat.active{background:linear-gradient(135deg,var(--purple),var(--orange));color:#fff;border-color:transparent}
    .catalog-cat-btn{padding:7px 14px;border-radius:20px;background:var(--bg3);border:1px solid rgba(255,255,255,.1);color:var(--text-dim);font-size:.74rem;font-weight:600;cursor:pointer;transition:all .2s}
    .catalog-cat-btn.active{background:linear-gradient(135deg,var(--purple),var(--orange));color:#fff;border-color:transparent}
    .catalog-group{margin-bottom:26px}
    .catalog-group-title{font-family:'Orbitron',sans-serif;font-size:.9rem;font-weight:700;color:var(--cyan,#78D2EB);letter-spacing:.08em;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid rgba(120,210,235,.2)}
    .catalog-list{display:flex;flex-direction:column;gap:0}
    .catalog-row{display:flex;gap:14px;align-items:center;background:var(--bg2);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px;margin-bottom:8px;transition:border-color .2s;position:relative}
    .catalog-row:hover{border-color:rgba(120,210,235,.3)}
    .catalog-row.admin-clickable{cursor:pointer}
    .catalog-thumb{width:54px;height:54px;flex-shrink:0;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .catalog-thumb img{max-width:100%;max-height:100%;object-fit:contain}
    .catalog-thumb-icon{font-size:1.5rem;opacity:.5}
    .catalog-info{flex:1;min-width:0}
    .catalog-name{font-weight:600;font-size:.9rem;color:var(--text);overflow:hidden;text-overflow:ellipsis}
    .catalog-meta{font-size:.72rem;color:var(--text-dim);margin-top:2px}
    .catalog-year{flex-shrink:0;font-family:'Orbitron',sans-serif;font-size:.8rem;color:var(--purple-light);font-weight:700}
    .catalog-chevron{flex-shrink:0;font-size:1.4rem;color:var(--text-dim);opacity:.5;margin-left:4px}
    .catalog-row:hover .catalog-chevron{opacity:1;color:var(--cyan,#78D2EB)}
    /* CATALOG DETAIL CARD */
    .catalog-detail-modal{text-align:center}
    .cd-img{width:100%;max-width:280px;margin:6px auto 16px;border-radius:14px;overflow:hidden;background:var(--bg);min-height:180px;display:flex;align-items:center;justify-content:center}
    .cd-img img{width:100%;height:auto;display:block;object-fit:contain;max-height:340px}
    .cd-noimg{font-size:4rem;opacity:.4;padding:50px 0}
    .cd-cat{display:inline-block;font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--cyan,#78D2EB);background:rgba(120,210,235,.1);padding:4px 12px;border-radius:20px;margin-bottom:8px}
    .cd-name{font-size:1.25rem;margin:0 0 6px;line-height:1.25}
    .cd-meta{font-family:'Orbitron',sans-serif;font-size:.82rem;color:var(--purple-light);font-weight:600;margin-bottom:10px}
    .cd-desc{font-size:.88rem;color:var(--text-dim);line-height:1.5;margin:0 0 18px;text-align:left}
    .cd-actions{display:flex;flex-direction:column;gap:10px;margin-top:8px}
    .cd-btn{border:none;border-radius:12px;padding:14px;font-weight:800;font-size:.92rem;cursor:pointer;transition:transform .12s,filter .12s}
    .cd-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .cd-btn:active{transform:translateY(0)}
    .cd-btn-owned{background:linear-gradient(135deg,#3DD68C,#1E9E63);color:#06140d}
    .cd-btn-wish{background:linear-gradient(135deg,#FFD447,#FF9D2E);color:#1a1200}
    .cd-admin-edit{margin-top:14px;width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px;color:var(--text-dim);cursor:pointer;font-size:.82rem}
    .app-content,.stats-body,.admin-body,.market-body,.public-body{padding-bottom:50px}
    /* GUIDE */
    .guide-wrap{max-width:840px;margin:0 auto}
    .guide-hero{text-align:center;padding:30px 20px 36px;background:linear-gradient(160deg,rgba(120,210,235,.12),rgba(155,111,244,.06));border:1px solid rgba(120,210,235,.2);border-radius:18px;margin-bottom:28px}
    .guide-hero-badge{font-family:'Orbitron',sans-serif;font-size:.62rem;letter-spacing:.22em;color:var(--purple-light);margin-bottom:14px}
    .guide-hero-title{font-family:'Orbitron',sans-serif;font-size:1.5rem;color:var(--text);margin:0 0 8px}
    .guide-hero-sub{color:var(--text-dim);font-size:.9rem;margin:0 0 20px}
    .guide-pdf-btn{padding:11px 22px;background:linear-gradient(135deg,var(--purple),var(--orange));border:none;border-radius:10px;color:#fff;font-family:'Orbitron',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.04em;cursor:pointer}
    .guide-pdf-btn:hover{opacity:.92}
    .guide-section-label{font-family:'Orbitron',sans-serif;font-size:.82rem;font-weight:700;letter-spacing:.14em;color:var(--cyan,#78D2EB);text-transform:uppercase;margin:34px 0 16px;padding-bottom:8px;border-bottom:1px solid rgba(120,210,235,.2)}
    .guide-section-label.admin{color:var(--orange);border-color:rgba(255,107,26,.25)}
    .guide-card{display:flex;gap:16px;align-items:flex-start;background:var(--bg2);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:18px 20px;margin-bottom:14px;transition:border-color .2s}
    .guide-card:hover{border-color:rgba(120,210,235,.3)}
    .guide-card.admin:hover{border-color:rgba(255,107,26,.3)}
    .guide-card-icon{font-size:1.6rem;flex-shrink:0;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:10px}
    .guide-card-content h3{font-family:'Orbitron',sans-serif;font-size:.9rem;color:var(--text);margin:2px 0 6px}
    .guide-card-content p{color:var(--text-dim);font-size:.86rem;line-height:1.55;margin:0}
    .guide-card-content strong{color:var(--text)}
    .guide-card-content em{color:var(--purple-light);font-style:normal}
    .guide-footer{text-align:center;padding:30px 0 10px;color:var(--text-dim);font-size:.82rem;display:flex;flex-direction:column;align-items:center;gap:10px}
    .guide-footer-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;opacity:.9}
    @media(max-width:600px){.guide-card{padding:14px}.guide-hero-title{font-size:1.2rem}}
    /* MOBILE MENU */
    .mobile-menu-btn{display:none;background:transparent;border:1px solid rgba(255,255,255,.15);border-radius:8px;padding:6px 10px;color:var(--chrome);font-size:1.1rem;cursor:pointer;flex-shrink:0}
    .mobile-menu-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:800}
    .mobile-menu-overlay.open{display:block}
    .mobile-menu-panel{position:fixed;top:0;left:0;bottom:0;width:290px;background:var(--bg2);border-right:1px solid rgba(255,255,255,.08);z-index:801;padding:20px 16px;display:flex;flex-direction:column;gap:7px;transform:translateX(-100%);transition:transform .3s ease;overflow-y:auto}
    .mobile-menu-panel.open{transform:translateX(0)}
    .mobile-menu-panel .menu-item{display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:10px;background:var(--bg3);border:1px solid rgba(255,255,255,.07);color:var(--text);font-size:.82rem;font-weight:600;cursor:pointer;text-decoration:none;font-family:Inter,sans-serif}
    .mobile-menu-panel .menu-item:hover{background:rgba(123,79,212,.2);border-color:rgba(123,79,212,.3)}
    .menu-user{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(123,79,212,.2),rgba(255,107,26,.1));border:1px solid rgba(123,79,212,.3);cursor:pointer;margin-bottom:6px}
    .menu-user-av{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--orange));display:flex;align-items:center;justify-content:center;font-size:1.4rem;overflow:hidden;flex-shrink:0}
    .menu-user-av img{width:100%;height:100%;object-fit:cover}
    .menu-user-name{font-weight:700;font-size:.95rem;font-family:'Orbitron',sans-serif}
    .menu-user-sub{font-size:.68rem;color:var(--text-dim)}
    .menu-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 8px}
    .menu-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;border-radius:14px;background:var(--bg3);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:.16s}
    .menu-card:hover{background:rgba(123,79,212,.2);border-color:var(--purple);transform:translateY(-2px)}
    .menu-card .mc-ic{display:none}
    .menu-card .mc-lbl{font-size:.74rem;font-weight:600;text-align:center}
    .menu-section-title{font-size:.62rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin:12px 6px 2px}
    .menu-section-title:first-of-type{margin-top:4px}
    .mobile-menu-close{align-self:flex-end;background:transparent;border:none;color:var(--text-dim);font-size:1.3rem;cursor:pointer;padding:4px 8px}
    
    /* PRICE NOTIF */
    .price-notif{background:rgba(255,212,71,.08);border:1px solid rgba(255,212,71,.25);border-radius:12px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
    .price-notif-icon{font-size:1.4rem;flex-shrink:0}
    .price-notif-text{flex:1}
    .price-notif-title{font-size:.82rem;font-weight:600;color:var(--wishlist);margin-bottom:2px}
    .price-notif-sub{font-size:.72rem;color:var(--text-dim)}
    .price-notif-btn{padding:6px 14px;background:rgba(255,212,71,.15);border:1px solid rgba(255,212,71,.3);border-radius:8px;color:var(--wishlist);font-size:.72rem;font-weight:600;cursor:pointer;font-family:Inter,sans-serif;white-space:nowrap;flex-shrink:0}
    .price-notif-btn:hover{background:rgba(255,212,71,.25)}
    /* PUBLIC PROFILE */
    .public-screen{display:none;position:fixed;inset:0;background:var(--bg);z-index:500;overflow-y:auto}
    .public-screen.open{display:block}
    /* WIKI */
    .wiki-list{display:flex;flex-direction:column;gap:12px}
    .wiki-card{display:flex;gap:14px;background:var(--bg3);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:14px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden}
    .wiki-card:hover{transform:translateY(-2px);border-color:var(--purple)}
    .wiki-card-thumb{width:80px;height:80px;flex-shrink:0;border-radius:10px;overflow:hidden;background:var(--bg2);display:flex;align-items:center;justify-content:center}
    .wiki-card-thumb img{width:100%;height:100%;object-fit:cover}
    .wiki-card-thumb .wiki-noimg{font-size:2rem;opacity:.4}
    .wiki-card-info{flex:1;min-width:0}
    .wiki-card-cat{display:inline-block;font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:var(--cyan,#78D2EB);background:rgba(120,210,235,.1);padding:2px 8px;border-radius:10px;margin-bottom:6px}
    .wiki-card-title{font-weight:700;font-size:.98rem;line-height:1.25;margin-bottom:4px}
    .wiki-card-date{font-family:'Orbitron',sans-serif;font-size:.72rem;color:var(--purple-light);font-weight:600}
    .wiki-card-excerpt{font-size:.78rem;color:var(--text-dim);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
